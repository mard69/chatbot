<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antaricksh's AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ── Reset & Base ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-void:       #080a10;
  --bg-base:       #0d0f18;
  --bg-surface:    #12151f;
  --bg-elevated:   #181c2a;
  --bg-glass:      rgba(255,255,255,0.035);
  --border:        rgba(255,255,255,0.06);
  --border-active: rgba(99,102,241,0.45);

  --accent:        #6366f1;
  --accent-soft:   rgba(99,102,241,0.18);
  --accent-glow:   rgba(99,102,241,0.35);
  --cyan:          #22d3ee;
  --cyan-soft:     rgba(34,211,238,0.15);

  --text-primary:  #f0f2fc;
  --text-secondary:#8b90b0;
  --text-dim:      #4b5073;

  --user-bubble:   linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
  --bot-bubble:    #181c2a;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-void);
  color: var(--text-primary);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  position: relative;
}

/* ── Ambient Background ───────────────────────────────── */
.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.18;
  animation: drift 12s ease-in-out infinite alternate;
}

.orb-1 {
  width: 520px; height: 520px;
  background: radial-gradient(circle, #6366f1, transparent 70%);
  top: -180px; left: -100px;
  animation-duration: 14s;
}

.orb-2 {
  width: 380px; height: 380px;
  background: radial-gradient(circle, #22d3ee, transparent 70%);
  bottom: -120px; right: -60px;
  opacity: 0.12;
  animation-duration: 10s;
  animation-direction: alternate-reverse;
}

.orb-3 {
  width: 240px; height: 240px;
  background: radial-gradient(circle, #a78bfa, transparent 70%);
  top: 50%; right: 15%;
  opacity: 0.1;
  animation-duration: 18s;
}

@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(30px, 20px) scale(1.08); }
}

/* ── Chat Shell ───────────────────────────────────────── */
.shell {
  position: relative;
  z-index: 1;
  width: 92%;
  max-width: 860px;
  height: 90vh;
  max-height: 820px;
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow:
    0 32px 80px rgba(0,0,0,0.6),
    0 0 0 1px rgba(255,255,255,0.02) inset,
    0 1px 0 rgba(255,255,255,0.07) inset;
  overflow: hidden;
}

/* ── Header ───────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 26px;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  box-shadow: 0 0 18px var(--accent-glow);
  flex-shrink: 0;
}

.header-info { display: flex; flex-direction: column; gap: 2px; }

.header-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--text-primary);
}

.header-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}

.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #22d3ee;
  box-shadow: 0 0 8px #22d3ee;
  animation: pulse-dot 2.5s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.5; transform: scale(0.85); }
}

.header-model {
  font-size: 11.5px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  background: var(--bg-glass);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 6px;
  letter-spacing: 0.3px;
}

/* ── Messages Area ────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 26px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  scroll-behavior: smooth;
}

.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
}
.messages::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

/* ── Message Rows ─────────────────────────────────────── */
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  animation: slideUp 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.msg-row.user  { flex-direction: row-reverse; }
.msg-row.bot   { flex-direction: row; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  margin-bottom: 2px;
}

.msg-row.user .msg-avatar {
  background: linear-gradient(135deg, #6366f1, #4f46e5);
  box-shadow: 0 0 12px var(--accent-glow);
}

.msg-row.bot .msg-avatar {
  background: linear-gradient(135deg, #1e2235, #252a3d);
  border: 1px solid var(--border);
  color: var(--cyan);
}

.msg-content {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-width: 72%;
}

.msg-row.user .msg-content { align-items: flex-end; }
.msg-row.bot  .msg-content { align-items: flex-start; }

.bubble {
  padding: 13px 17px;
  border-radius: var(--radius-md);
  font-size: 14.5px;
  line-height: 1.65;
  word-break: break-word;
  position: relative;
}

.msg-row.user .bubble {
  background: var(--user-bubble);
  color: #fff;
  border-bottom-right-radius: 4px;
  box-shadow: 0 6px 20px rgba(99,102,241,0.28);
}

.msg-row.bot .bubble {
  background: var(--bot-bubble);
  color: var(--text-primary);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}

.timestamp {
  font-size: 11px;
  color: var(--text-dim);
}

.copy-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: 11px;
  color: var(--text-dim);
  display: flex; align-items: center; gap: 3px;
  visibility: hidden;
  opacity: 0;
  transition: opacity 0.2s, color 0.15s;
}

.msg-row.bot .msg-content:hover .copy-btn {
  visibility: visible;
  opacity: 1;
}

.copy-btn:hover {
  color: var(--cyan);
  background: var(--cyan-soft);
}

/* ── Typing Indicator ─────────────────────────────────── */
.typing-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.typing-bubble {
  background: var(--bot-bubble);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  padding: 14px 18px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: 6px;
}

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: bounce 1.4s ease-in-out infinite;
}

.dot:nth-child(2) { animation-delay: 0.2s; background: #818cf8; }
.dot:nth-child(3) { animation-delay: 0.4s; background: var(--cyan); }

@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.6; }
  40%            { transform: translateY(-7px); opacity: 1; }
}

/* ── Input Bar ────────────────────────────────────────── */
.input-bar {
  padding: 16px 20px;
  background: var(--bg-base);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 8px 8px 8px 18px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-wrap:focus-within {
  border-color: var(--border-active);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

#userInput {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 14.5px;
  padding: 7px 0;
  caret-color: var(--accent);
}

#userInput::placeholder { color: var(--text-dim); }

.send-btn {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.12s, box-shadow 0.2s, background 0.2s;
  box-shadow: 0 4px 16px var(--accent-glow);
}

.send-btn:hover {
  background: #4f46e5;
  box-shadow: 0 6px 22px var(--accent-glow);
}

.send-btn:active { transform: scale(0.94); }

.send-btn svg {
  width: 18px; height: 18px;
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hint {
  text-align: center;
  font-size: 11.5px;
  color: var(--text-dim);
  margin-top: 9px;
}
</style>
</head>

<body>

<!-- Ambient glowing orbs -->
<div class="ambient">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Chat Shell -->
<div class="shell">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-avatar">🕋</div>
      <div class="header-info">
        <div class="header-name">ALLAH's AI</div>
        <div class="header-status">
          <span class="status-dot"></span>
          <span id="statusText">Allah is readyy</span>
        </div>
      </div>
    </div>
    <div class="header-model">Allah the real Allah</div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="msg-row bot">
      <div class="msg-avatar">✦</div>
      <div class="msg-content">
        <div class="bubble">Hey! Allah is here to help you — ask me anything! ☪️</div>
        <div class="msg-meta">
          <span class="timestamp" data-time></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-wrap">
      <input type="text" id="userInput" placeholder="Ask me anything…" autocomplete="off" />
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="hint">Press <kbd style="background:rgba(255,255,255,0.06);padding:1px 5px;border-radius:4px;font-family:inherit;">Enter</kbd> to send</div>
  </div>

</div>

<script>
const messagesEl = document.getElementById("messages");
const input      = document.getElementById("userInput");
const sendBtn    = document.getElementById("sendBtn");
const statusText = document.getElementById("statusText");

/* ══════════════════════════════════════════════════════
   🔔  OWNER NOTIFICATIONS — Discord Webhook
   ══════════════════════════════════════════════════════
   Paste your Discord webhook URL below to get a private
   Discord message every time someone asks your chatbot.

   How to get your webhook URL:
   1. Open Discord → go to any channel you own
   2. Click ⚙ Edit Channel → Integrations → Webhooks
   3. Click "New Webhook" → Copy Webhook URL
   4. Paste it below between the quotes

   Leave it as "" to disable notifications.
   ══════════════════════════════════════════════════════ */
const NOTIFY_WEBHOOK = "https://discord.com/api/webhooks/1514639201033916517/qUUZ2qkXbEjhJZGv5DLAl1EKvuKmOJh3agc5ti3RiTVblSZseseVR9Ko3xO3Hg1d-Xq2";  // ← paste your Discord webhook URL here

/* Sends a silent notification to Discord with the Q&A pair */
function notifyOwner(question, answer) {
  if (!NOTIFY_WEBHOOK) return; // disabled — do nothing

  const time = new Date().toLocaleString("en-IN", {
    timeZone: "Asia/Kolkata",
    dateStyle: "medium",
    timeStyle: "short"
  });

  // Trim long answers so Discord doesn't reject the payload
  const shortAnswer = answer.length > 800
    ? answer.slice(0, 800) + "…"
    : answer;

  const payload = {
    username: "Antaricksh's AI — Log",
    avatar_url: "https://cdn.discordapp.com/embed/avatars/0.png",
    embeds: [{
      color: 0x6366f1,
      fields: [
        {
          name: "❓ Question asked",
          value: question
        },
        {
          name: "🤖 Bot replied",
          value: shortAnswer
        }
      ],
      footer: { text: `🕐 ${time} IST` }
    }]
  };

  // Fire-and-forget — user never sees this
  fetch(NOTIFY_WEBHOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).catch(() => {}); // Silent fail — never crashes the chat
}

/* ── Timestamp stamp the initial bot message ─────────── */
document.querySelector("[data-time]").textContent = now();

/* ── Helpers ─────────────────────────────────────────── */
function now() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function scrollBottom() {
  messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
}

/* ── Render a message row ─────────────────────────────── */
function addMessage(text, role) {
  const row = document.createElement("div");
  row.classList.add("msg-row", role);

  const ava = document.createElement("div");
  ava.classList.add("msg-avatar");
  ava.textContent = role === "user" ? "👤" : "✦";

  const content = document.createElement("div");
  content.classList.add("msg-content");

  const bubble = document.createElement("div");
  bubble.classList.add("bubble");
  bubble.textContent = text;

  const meta = document.createElement("div");
  meta.classList.add("msg-meta");

  const ts = document.createElement("span");
  ts.classList.add("timestamp");
  ts.textContent = now();

  meta.appendChild(ts);

  // Copy button on bot messages
  if (role === "bot") {
    const copyBtn = document.createElement("button");
    copyBtn.classList.add("copy-btn");
    copyBtn.innerHTML = `
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      Copy`;
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = "✓ Copied";
        setTimeout(() => {
          copyBtn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
        }, 2000);
      });
    };
    meta.appendChild(copyBtn);
  }

  content.appendChild(bubble);
  content.appendChild(meta);
  row.appendChild(ava);
  row.appendChild(content);
  messagesEl.appendChild(row);
  scrollBottom();
  return row;
}

/* ── Typing Indicator ─────────────────────────────────── */
function addTypingIndicator() {
  const row = document.createElement("div");
  row.classList.add("typing-row");
  row.id = "typingIndicator";

  const ava = document.createElement("div");
  ava.classList.add("msg-avatar");
  ava.style.cssText = "width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:linear-gradient(135deg,#1e2235,#252a3d);border:1px solid rgba(255,255,255,0.06);color:#22d3ee;";
  ava.textContent = "✦";

  const bubble = document.createElement("div");
  bubble.classList.add("typing-bubble");

  for (let i = 0; i < 3; i++) {
    const d = document.createElement("div");
    d.classList.add("dot");
    bubble.appendChild(d);
  }

  row.appendChild(ava);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

/* ── Send ─────────────────────────────────────────────── */
async function sendMessage() {
  const msg = input.value.trim();
  if (!msg) return;

  addMessage(msg, "user");
  input.value = "";
  input.disabled = true;
  sendBtn.disabled = true;
  sendBtn.style.opacity = "0.5";
  statusText.textContent = "Thinking…";

  addTypingIndicator();

  try {
    const res = await fetch("https://chatbot-t32i.onrender.com/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();
    removeTypingIndicator();
    addMessage(data.reply, "bot");
    statusText.textContent = "Online · Ready";

    // 🔔 Notify owner with question + bot reply (silent, non-blocking)
    notifyOwner(msg, data.reply);

  } catch (err) {
    removeTypingIndicator();
    addMessage("⚠ Could not reach the server. Check your connection.", "bot");
    statusText.textContent = "Connection error";
    console.error(err);
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    sendBtn.style.opacity = "1";
    input.focus();
  }
}

/* ── Enter key ────────────────────────────────────────── */
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) sendMessage();
});
</script>

</body>
</html>
