<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f14;
      --bg-card: #1a1a20;
      --fg: #e8e8ec;
      --muted: #71717a;
      --accent: #c8ff00;
      --border: #2a2a30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      background: var(--bg-card);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header span {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .messages {
      flex: 1;
      padding: 1rem 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .message {
      max-width: 80%;
      padding: 0.6rem 0.875rem;
      border-radius: 14px;
      font-size: 0.875rem;
      line-height: 1.5;
      position: relative;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #000;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .timestamp {
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 0.125rem;
      text-align: right;
    }

    .message.ai .timestamp { text-align: left; }

    .input-area {
      padding: 0.75rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .input-area input {
      flex: 1;
      background: var(--bg);
      border: none;
      border-radius: 20px;
      padding: 0.5rem 0.75rem;
      color: var(--fg);
      font-size: 0.875rem;
      outline: none;
    }

    .input-area button {
      background: var(--accent);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .input-area button:hover {
      background: #b3e500;
    }

    .input-area button svg {
      width: 18px;
      height: 18px;
      fill: #000;
    }

    .hint {
      text-align: center;
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    @media (max-width: 480px) {
      .chat-container { margin: 0.5rem; border-radius: 16px; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h1>AI Assistant</h1>
    <span>v1.0</span>
  </div>

  <div class="messages" id="messages">
    <div class="message ai">Hello! How can I help you today?</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message…" autocomplete="off">
    <button id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3zM12 3L2 12h4v8L12 21l8-3-8-3-8 3v-8h4z"/></svg>
    </button>
  </div>
</div>

<script>
  const messages = document.getElementById('messages');
  const input    = document.getElementById('userInput');
  const sendBtn  = document.getElementById('sendBtn');

  function addMessage(text, isUser = false) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'ai'}`;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function getAIResponse(userText) {
    const lower = userText.toLowerCase();
    if (lower.includes('hello') || lower.includes('hi')) return 'Hello! How can I help you?';
    if (lower.includes('how are you')) return 'I\'m doing well, thanks!';
    if (lower.includes('time')) return `It's ${new Date().toLocaleTimeString()}`;
    if (lower.includes('help')) return 'I can answer basic questions or just chat.';
    return 'Interesting! Tell me more about that.';
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMessage(text, true);
    addMessage(getAIResponse(text), false);
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keypress', e => e.key === 'Enter' && sendMessage());
  input.focus();
</script>

</body>
</html>
