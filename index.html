<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#343541;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.chat-container{
    width:800px;
    height:90vh;
    background:#444654;
    border-radius:10px;
    display:flex;
    flex-direction:column;
}

.header{
    background:#202123;
    color:white;
    text-align:center;
    padding:15px;
    font-size:20px;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    max-width:80%;
}

.user{
    background:#10a37f;
    color:white;
    margin-left:auto;
}

.bot{
    background:#2d2f3a;
    color:white;
}

.input-area{
    display:flex;
    padding:10px;
    background:#202123;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:5px;
}

button{
    margin-left:10px;
    padding:12px 20px;
    background:#10a37f;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-container">
    <div class="header">ANTARICKSH'S AI</div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Allah isn't real. Now ask me anything else
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("userInput");

input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        sendMessage();
    }
});

function addMessage(text,sender){

    const div = document.createElement("div");

    div.classList.add("message");
    div.classList.add(sender);

    div.innerText = text;

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage(){

    const message = input.value.trim();

    if(!message) return;

    addMessage(message,"user");

    input.value = "";

    try{

        const response = await fetch(
            "https://chatbot-t32i.onrender.com/chat",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    message:message
                })
            }
        );

        const data = await response.json();

        addMessage(data.reply,"bot");

    }catch(error){

        addMessage("Failed to connect to backend.","bot");
        console.error(error);
    }
}

</script>

</body>
</html>
